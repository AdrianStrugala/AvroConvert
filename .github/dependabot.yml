version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      confluent:
        patterns: ["Confluent.*"]
      tests:
        patterns: ["NUnit*", "Microsoft.NET.Test.Sdk", "AwesomeAssertions", "AutoFixture", "Microsoft.AspNetCore.TestHost"]
      benchmarks:
        patterns: ["BenchmarkDotNet", "Apache.Avro*", "GroBuf", "MongoDB.Bson", "Google.Protobuf", "BrotliSharpLib", "Equals.Fody"]
    ignore:
      # Benchmarks compare against these exact published versions on purpose.
      - dependency-name: AvroConvert
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

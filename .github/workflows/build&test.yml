name: Build&Test

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore AvroConvert.sln
    - name: Build
      run: dotnet build AvroConvert.sln --no-restore -c Release
    - name: Test
      run: dotnet test AvroConvert.sln --no-build -c Release --verbosity normal
    - name: Pack
      run: |
        dotnet pack src/AvroConvert/AvroConvert.csproj --no-build -c Release -o artifacts
        dotnet pack src/SolTechnology.Avro.Http/SolTechnology.Avro.Http.csproj --no-build -c Release -o artifacts
        dotnet pack src/Soltechnology.Avro.Kafka/SolTechnology.Avro.Kafka.csproj --no-build -c Release -o artifacts
    - uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: artifacts/*.nupkg

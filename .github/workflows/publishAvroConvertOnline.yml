name: publishAvroConvertOnline

# AvroConvert Online moved to https://soltechnology.dev/avroconvert/online/ (built from sol-technology/sol-technology.github.io).
# This replaces the old Blazor app on the gh-pages branch with a redirect, so existing links keep working.

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publishAvroConvertOnline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>AvroConvert Online has moved</title>
            <link rel="canonical" href="https://soltechnology.dev/avroconvert/online/">
            <meta http-equiv="refresh" content="0; url=https://soltechnology.dev/avroconvert/online/">
            <meta name="robots" content="noindex">
          </head>
          <body>
            <p>AvroConvert Online has moved to <a href="https://soltechnology.dev/avroconvert/online/">soltechnology.dev/avroconvert/online</a>.</p>
            <script>location.replace("https://soltechnology.dev/avroconvert/online/" + location.hash);</script>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Replace gh-pages with the redirect
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
